[workspace]
resolver = "2"
members = [
    "crates/boomerang-core",
    "crates/video-chunking",
    "crates/semantic-embed",
    "crates/vector-store",
    "crates/footage-search",
    "crates/clip-trim",
    "crates/boomerang-cli",
    "crates/boomerang-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iBz-04/boomerang"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Numerics
nalgebra = "0.33"
ndarray = "0.16"

# Config
dotenvy = "0.15"

# UUID
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Base64 encoding
base64 = "0.22"

# Internal crates
boomerang-core = { path = "crates/boomerang-core" }
video-chunking = { path = "crates/video-chunking" }
semantic-embed = { path = "crates/semantic-embed" }
vector-store = { path = "crates/vector-store" }
footage-search = { path = "crates/footage-search" }
clip-trim = { path = "crates/clip-trim" }

# Testing
proptest = "1"
insta = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
